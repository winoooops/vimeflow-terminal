name: Fork CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            kind: unix
          - os: macos-latest
            kind: unix
          - os: windows-2022
            kind: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Reject removed-path reappearance
        if: matrix.kind == 'unix'
        shell: bash
        run: |
          guard_result=0
          while IFS= read -r removed; do
            if [ -z "$removed" ] || [ "${removed#\#}" != "$removed" ]; then
              continue
            fi
            resurrected="$(git ls-files -- "$removed")"
            if [ -n "$resurrected" ]; then
              printf 'Registered removed path reappeared: %s\n%s\n' "$removed" "$resurrected" >&2
              guard_result=1
            fi
          done < REMOVED_PATHS
          exit "$guard_result"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: 1.96.1
          components: ${{ matrix.kind == 'windows' && 'clippy' || '' }}
          targets: ${{ matrix.kind == 'windows' && 'x86_64-pc-windows-msvc' || '' }}

      - name: Install Rust test runner
        if: matrix.kind == 'unix'
        uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2.81.9
        with:
          tool: cargo-nextest

      - name: Install Zig
        if: runner.os != 'macOS'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
          use-cache: ${{ matrix.kind != 'windows' }}

      - name: Restore Homebrew Zig cache
        if: runner.os == 'macOS'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/Library/Caches/Homebrew/downloads
          key: homebrew-zig-0.15-${{ runner.os }}-${{ runner.arch }}
          restore-keys: |
            homebrew-zig-0.15-${{ runner.os }}-

      - name: Install patched Zig on macOS
        if: runner.os == 'macOS'
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 brew install zig@0.15
          echo "$(brew --prefix zig@0.15)/bin" >> "$GITHUB_PATH"
          echo "ZIG_GLOBAL_CACHE_DIR=$GITHUB_WORKSPACE/.zig-cache" >> "$GITHUB_ENV"
          echo "ZIG_LOCAL_CACHE_DIR=$GITHUB_WORKSPACE/.zig-cache" >> "$GITHUB_ENV"
          "$(brew --prefix zig@0.15)/bin/zig" version

      - name: Restore Zig build cache
        if: runner.os == 'macOS' || matrix.kind == 'windows'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .zig-cache
          key: zig-build-v1-${{ runner.os }}-${{ runner.arch }}-0.15.2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            zig-build-v1-${{ runner.os }}-${{ runner.arch }}-0.15.2-

      - name: Restore cargo cache
        if: matrix.kind == 'windows'
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: false
          key: fork-ci-windows

      - name: Build (Unix)
        if: matrix.kind == 'unix'
        run: cargo build --locked

      - name: Test (Unix)
        if: matrix.kind == 'unix'
        run: cargo nextest run --locked -E '${{ matrix.os == 'macos-latest' && 'not binary(live_handoff)' || 'all()' }}' --status-level fail --final-status-level fail --failure-output final --success-output never

      - name: Run Windows checks
        if: matrix.kind == 'windows'
        shell: pwsh
        run: .\scripts\windows_check.ps1 -Mode check
